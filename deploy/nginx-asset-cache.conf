# ===== WO-209 缓存二分法 · css/js 1 年长缓存（immutable 令牌不在本轮）=====
# 落位：/www/server/panel/vhost/nginx/extension/store.fangkelianmeng.com/cache-long.conf
# 仓库单源：store-web/deploy/nginx-asset-cache.conf（线上落位见上一行）
# 回滚：删除本文件 -> nginx -t -> nginx -s reload（不动宝塔主配置，可安全回退）
# 依据（2026-11-16 线上 nginx -T 实测）：
#   主配置 html_store.fangkelianmeng.com.conf 的 `location ~ .*\.(js|css)?$ { expires 12h; }`
#   位于本 extension include 之后；正则 location 按出现顺序取首个命中，故本片段优先生效。
# 只用 expires、不写 add_header：location 内一旦出现 add_header，server 层 5 项安全头
#   会在该响应上整体失效（nginx 继承语义）。immutable 令牌属模板统一治理，本轮不动。
# HTML 不落在该正则内，仍由 extension/cache.conf 的 server 级 expires -1 回源，改版立刻生效。
location ~* \.(?:css|js)$ {
    expires 1y;
    access_log off;
    error_log /dev/null;
}
