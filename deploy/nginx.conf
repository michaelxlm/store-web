# store.fangkelianmeng.com 生产 nginx 版本化记录
# 实际生效文件（宝塔）：
#   /www/server/panel/vhost/nginx/html_store.fangkelianmeng.com.conf     站点与 SSL
#   /www/server/panel/vhost/rewrite/html_store.fangkelianmeng.com.conf  下方 STATIC-MPA 段
# 修改后务必：nginx -t && nginx -s reload

# ============ STATIC-MPA（写入 rewrite include，位于 server 块内）============
# 多页静态站：真实文件直出，不启用 SPA 回退（软 404 会污染收录）
error_page 404 /404.html;
location / {
    # 真实文件直出；目录型 URL 回退到 <dir>/index.html，仍不存在即 404
    try_files $uri $uri/index.html =404;
}

# 旧 uni-app 路径（/pages/*、/pages_ucenter/*）一律 301 到首页，避免旧外链/已收录 URL 落到 404（WO-131 切流）
location ~ ^/(pages|pages_ucenter)(/|$) {
    return 301 /;
}

# canonical：去尾斜杠（根路径除外）
rewrite ^/(.+)/$ /$1 permanent;

# 注：部署流水线的 tar 同步不做删除。2026-10-22 已按上述 301 规则切换并清理站点根旧目录，
#     旧产物移出至 /www/wwwroot/_legacy-store-h5-20261022（保留回滚，确认无误后可删）。

# ============ 缓存（沿用站点既有规则，与其余静态站一致）============
# location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; }
# location ~ .*\.(js|css)?$               { expires 12h; }
# 资源引用均带 ?v=<内容哈希>（scripts/fingerprint.js），缓存期内更新不会串版本。
# HTML 不设 expires，始终回源。

